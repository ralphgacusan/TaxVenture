<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="870" viewBox="0 0 1500 870"><rect width="1500" height="870" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#222} .s{fill:white;stroke:#222;stroke-width:3;stroke-linejoin:round}.a{fill:none;stroke:#222;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#222"/></marker></defs><g transform="translate(15,15)"><rect class="s" width="480" height="410"/><text x="18" y="35" font-size="23" font-weight="bold">1. READ</text><text x="18" y="65" font-size="16">One record on the stand</text><path class="s" d="M20 340 L460 340 L440 365 L40 365 Z"/><path class="s" d="M245 175 L395 175 L420 325 L225 325 Z"/><rect class="s" x="265" y="185" width="110" height="10"/><circle class="s" cx="322" cy="257" r="27"/><path class="s" d="M322 257 L322 237"/><text x="287" y="218" font-size="13">INCOME</text><text x="232" y="294" font-size="12">DEDUCT</text><text x="345" y="294" font-size="12">LEAVE OUT</text><path class="s" d="M414 300 L441 237"/><circle class="s" cx="442" cy="233" r="11"/><path class="s" d="M40 200 L195 200 L184 318 L28 318 Z"/><text x="47" y="230" font-size="17">Logo work</text><text x="47" y="260" font-size="18">P500,000</text><text x="18" y="390" font-size="15">Read or inspect original</text></g><g transform="translate(510,15)"><rect class="s" width="480" height="410"/><text x="18" y="35" font-size="23" font-weight="bold">2. FEED HALFWAY</text><text x="18" y="65" font-size="16">Drag card to intake; header stays out</text><path class="s" d="M20 340 L460 340 L440 365 L40 365 Z"/><path class="s" d="M245 175 L395 175 L420 325 L225 325 Z"/><rect class="s" x="265" y="185" width="110" height="10"/><circle class="s" cx="322" cy="257" r="27"/><path class="s" d="M322 257 L322 237"/><text x="287" y="218" font-size="13">INCOME</text><text x="232" y="294" font-size="12">DEDUCT</text><text x="345" y="294" font-size="12">LEAVE OUT</text><path class="s" d="M414 300 L441 237"/><circle class="s" cx="442" cy="233" r="11"/><rect class="s" x="271" y="112" width="98" height="77"/><text x="277" y="138" font-size="13">Logo work</text><text x="277" y="160" font-size="14">P500,000</text><path class="s" d="M40 200 L195 200 L184 318 L28 318 Z"/><text x="47" y="230" font-size="17">Logo work</text><text x="47" y="260" font-size="18">P500,000</text><path class="a" d="M157 180 Q215 103 268 138"/><text x="18" y="390" font-size="15">Gentle snap; no choice saved yet</text></g><g transform="translate(1005,15)"><rect class="s" width="480" height="410"/><text x="18" y="35" font-size="23" font-weight="bold">3. DECIDE</text><text x="18" y="65" font-size="16">Turn dial; Why? for two exceptions</text><path class="s" d="M20 340 L460 340 L440 365 L40 365 Z"/><path class="s" d="M245 175 L395 175 L420 325 L225 325 Z"/><rect class="s" x="265" y="185" width="110" height="10"/><circle class="s" cx="322" cy="257" r="27"/><path class="s" d="M322 257 L322 237"/><text x="287" y="218" font-size="13">INCOME</text><text x="232" y="294" font-size="12">DEDUCT</text><text x="345" y="294" font-size="12">LEAVE OUT</text><path class="s" d="M414 300 L441 237"/><circle class="s" cx="442" cy="233" r="11"/><rect class="s" x="271" y="112" width="98" height="77"/><text x="277" y="138" font-size="13">Logo work</text><text x="277" y="160" font-size="14">P500,000</text><path class="s" d="M40 200 L195 200 L184 318 L28 318 Z"/><text x="47" y="230" font-size="17">Chosen: Income</text><text x="47" y="260" font-size="18"></text><path class="a" d="M287 249 Q290 226 313 229"/><text x="38" y="295" font-size="14">Income / Deduct / Leave Out</text><text x="18" y="390" font-size="15">Neutral start; no correctness cue</text></g><g transform="translate(15,440)"><rect class="s" width="480" height="410"/><text x="18" y="35" font-size="23" font-weight="bold">4. PULL TO FILE</text><text x="18" y="65" font-size="16">Save first, then rollers draw it inside</text><path class="s" d="M20 340 L460 340 L440 365 L40 365 Z"/><path class="s" d="M245 175 L395 175 L420 325 L225 325 Z"/><rect class="s" x="265" y="185" width="110" height="10"/><circle class="s" cx="322" cy="257" r="27"/><path class="s" d="M322 257 L322 237"/><text x="287" y="218" font-size="13">INCOME</text><text x="232" y="294" font-size="12">DEDUCT</text><text x="345" y="294" font-size="12">LEAVE OUT</text><path class="s" d="M414 300 L441 237"/><circle class="s" cx="442" cy="233" r="11"/><path class="a" d="M315 110 L315 174"/><path class="a" d="M456 250 L456 302"/><text x="252" y="145" font-size="14">feed inside</text><path class="s" d="M40 200 L195 200 L184 318 L28 318 Z"/><text x="47" y="230" font-size="17">Pull lever</text><text x="47" y="260" font-size="18"></text><text x="18" y="390" font-size="15">Same animation for every valid choice</text></g><g transform="translate(510,440)"><rect class="s" width="480" height="410"/><text x="18" y="35" font-size="23" font-weight="bold">5. CHECK + CORRECT</text><text x="18" y="65" font-size="16">Review batch; recall mistakes; recheck</text><path class="s" d="M20 340 L460 340 L440 365 L40 365 Z"/><path class="s" d="M245 175 L395 175 L420 325 L225 325 Z"/><rect class="s" x="265" y="185" width="110" height="10"/><circle class="s" cx="322" cy="257" r="27"/><path class="s" d="M322 257 L322 237"/><text x="287" y="218" font-size="13">INCOME</text><text x="232" y="294" font-size="12">DEDUCT</text><text x="345" y="294" font-size="12">LEAVE OUT</text><path class="s" d="M414 300 L441 237"/><circle class="s" cx="442" cy="233" r="11"/><path class="s" d="M40 200 L195 200 L184 318 L28 318 Z"/><text x="47" y="230" font-size="17">Recall record</text><text x="47" y="260" font-size="18"></text><rect class="s" x="42" y="110" width="135" height="45"/><text x="52" y="139" font-size="16">CHECK BATCH</text><path class="a" d="M253 318 Q173 350 151 300"/><text x="18" y="390" font-size="15">First score stays; corrections allow progress</text></g><g transform="translate(1005,440)"><rect class="s" width="480" height="410"/><text x="18" y="35" font-size="23" font-weight="bold">6. COLLECT</text><text x="18" y="65" font-size="16">Folded summary to Bag, then office</text><path class="s" d="M20 340 L460 340 L440 365 L40 365 Z"/><path class="s" d="M245 175 L395 175 L420 325 L225 325 Z"/><rect class="s" x="265" y="185" width="110" height="10"/><circle class="s" cx="322" cy="257" r="27"/><path class="s" d="M322 257 L322 237"/><text x="287" y="218" font-size="13">INCOME</text><text x="232" y="294" font-size="12">DEDUCT</text><text x="345" y="294" font-size="12">LEAVE OUT</text><path class="s" d="M414 300 L441 237"/><circle class="s" cx="442" cy="233" r="11"/><rect class="s" x="45" y="200" width="150" height="115"/><text x="55" y="225" font-size="15">BEA SUMMARY</text><text x="55" y="252" font-size="14">Income P900,000</text><text x="55" y="275" font-size="14">Deduct P300,000</text><text x="55" y="300" font-size="14">[ COLLECT ]</text><path class="a" d="M240 317 L200 290"/><text x="35" y="390" font-size="18">Bag → Folder support → Office case</text></g></svg>